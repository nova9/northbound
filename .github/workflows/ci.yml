name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies for wallet build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Check formatting and run workspace unit tests
        run: |
          rustup update stable --no-self-update
          rustup component add rustfmt --toolchain stable
          cargo +stable fmt --all -- --check
          cargo +stable test --workspace --locked
