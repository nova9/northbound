name: macOS release build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install prebuilt Dioxus CLI
        run: |
          curl --fail --location --retry 3 \
            https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-aarch64-apple-darwin.tar.gz \
            -o "$RUNNER_TEMP/dx.tar.gz"
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "$RUNNER_TEMP/dx.tar.gz" -C "$HOME/.cargo/bin"
          "$HOME/.cargo/bin/dx" --version

      - name: Build mainnet wallet
        run: ./scripts/build-wallet.sh

      - name: Archive macOS app
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            target/dx/Northbound/bundle/macos/macos/Northbound.app \
            dist/Northbound-macos-arm64.zip
          cd dist
          shasum -a 256 Northbound-macos-arm64.zip > Northbound-macos-arm64.zip.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Northbound-macos-arm64
          path: dist/*
          if-no-files-found: error

      - name: Attach files to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
