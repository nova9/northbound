name: macOS release build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update
          rustup default stable

      - name: Verify Rust packaging tools
        run: |
          rust_sysroot=$(rustc --print sysroot)
          "$rust_sysroot/lib/rustlib/aarch64-apple-darwin/bin/rust-objcopy" --version

      - name: Install prebuilt Dioxus CLI
        run: |
          curl --fail --location --retry 3 \
            https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-aarch64-apple-darwin.tar.gz \
            -o "$RUNNER_TEMP/dx.tar.gz"
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "$RUNNER_TEMP/dx.tar.gz" -C "$HOME/.cargo/bin"
          "$HOME/.cargo/bin/dx" --version

      - name: Build mainnet wallet
        run: ./scripts/build-wallet.sh

      - name: Ad-hoc sign and verify macOS app
        run: |
          app_path=target/dx/Northbound/bundle/macos/macos/Northbound.app
          codesign --force --sign - "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Archive macOS app
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          build_version=${RELEASE_TAG:-dev-${GITHUB_SHA:0:7}}
          case "$build_version" in
            *[!a-zA-Z0-9._-]*)
              echo "Release tag must contain only letters, numbers, dots, underscores, and hyphens." >&2
              exit 1
              ;;
          esac
          archive_name="Northbound-${build_version}-macos-arm64.zip"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            target/dx/Northbound/bundle/macos/macos/Northbound.app \
            "dist/$archive_name"
          cd dist
          shasum -a 256 "$archive_name" > "$archive_name.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Northbound-macos-arm64
          path: dist/*
          if-no-files-found: error

      - name: Attach files to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  deploy-website:
    name: Deploy release website
    needs: build-macos
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Prepare release website
        id: website
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/releases.json"
          jq 'add | map(select(.draft == false)) | max_by(.published_at)' \
            "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/release.json"
          latest_tag=$(jq -r '.tag_name' "$RUNNER_TEMP/release.json")
          if [ "$latest_tag" != "$RELEASE_TAG" ]; then
            echo "Skipping website deployment: this is not the most recently published release."
            exit 0
          fi
          python3 scripts/build-website.py "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/website"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        if: steps.website.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload website
        if: steps.website.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/website

      - name: Deploy GitHub Pages
        if: steps.website.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
