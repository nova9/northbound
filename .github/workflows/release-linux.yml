name: Linux release build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config curl wget file libgtk-3-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev lld \
            xvfb xauth xdotool dbus-x11 libgl1-mesa-dri

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update
          rustup default stable

      - name: Verify Rust packaging tools
        run: |
          rust_sysroot=$(rustc --print sysroot)
          "$rust_sysroot/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-objcopy" --version

      - name: Install prebuilt Dioxus CLI
        run: |
          curl --fail --location --retry 3 \
            https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/dx.tar.gz"
          echo "4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7  $RUNNER_TEMP/dx.tar.gz" | sha256sum --check
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "$RUNNER_TEMP/dx.tar.gz" -C "$HOME/.cargo/bin"
          "$HOME/.cargo/bin/dx" --version

      - name: Build mainnet wallet
        run: ./scripts/build-wallet.sh

      - name: Prepare Linux AppImage and checksum
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          build_version=${RELEASE_TAG:-dev-${GITHUB_SHA:0:7}}
          case "$build_version" in
            *[!a-zA-Z0-9._-]*)
              echo "Release tag must contain only letters, numbers, dots, underscores, and hyphens." >&2
              exit 1
              ;;
          esac
          shopt -s nullglob
          appimages=(target/dx/Northbound/bundle/linux/appimage/*.AppImage)
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "Expected exactly one Linux AppImage, found ${#appimages[@]}." >&2
            exit 1
          fi
          appimage_name="Northbound-${build_version}-linux-x64.AppImage"
          mkdir -p dist
          cp "${appimages[0]}" "dist/$appimage_name"
          chmod +x "dist/$appimage_name"
          cd dist
          sha256sum "$appimage_name" > "$appimage_name.sha256"

      - name: Verify AppImage opens a wallet window
        timeout-minutes: 2
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" dbus-run-session -- bash <<'CHECK'
          set -euo pipefail
          check_directory=$(mktemp -d)
          export XDG_DATA_HOME="$check_directory/data"
          export XDG_CONFIG_HOME="$check_directory/config"
          export XDG_CACHE_HOME="$check_directory/cache"
          appimages=(dist/*.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 "${appimages[0]}" > "$check_directory/startup.log" 2>&1 &
          wallet_pid=$!
          cleanup() {
            kill "$wallet_pid" 2>/dev/null || true
            wait "$wallet_pid" 2>/dev/null || true
            rm -rf "$check_directory"
          }
          trap cleanup EXIT
          startup_timeout=45
          deadline=$((SECONDS + startup_timeout))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$wallet_pid" 2>/dev/null; then
              echo "Wallet exited before opening its window." >&2
              cat "$check_directory/startup.log"
              exit 1
            fi
            if xdotool search --onlyvisible --name '^Northbound$' > /dev/null 2>&1; then
              echo "Northbound window opened successfully."
              exit 0
            fi
            sleep 1
          done
          echo "Wallet window did not open within $startup_timeout seconds." >&2
          cat "$check_directory/startup.log"
          exit 1
          CHECK

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Northbound-linux-x64
          path: dist/*
          if-no-files-found: error

      - name: Attach files to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
