name: Linux server release build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Test and build the server
        run: |
          rustup update stable --no-self-update
          cargo +stable test --locked -p server
          cargo +stable build --locked --release -p server --bin server

      - name: Package Linux server
        run: |
          mkdir -p dist
          install -m755 target/release/server dist/northbound-server-linux-x64
          cd dist
          sha256sum northbound-server-linux-x64 > northbound-server-linux-x64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: northbound-server-linux-x64
          path: dist/*
          if-no-files-found: error

      - name: Attach server to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
