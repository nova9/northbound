name: Windows release build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable

      - name: Verify Rust packaging tools
        run: |
          $rustSysroot = rustc --print sysroot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$rustSysroot/lib/rustlib/x86_64-pc-windows-msvc/bin/rust-objcopy.exe" --version

      - name: Install prebuilt Dioxus CLI
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "dx.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-pc-windows-msvc.zip" `
            -OutFile $archive
          $expectedHash = "45eb4f87b7f86fdba8508ee7e0ef1f9e13cf8f2ffcc6a2d5858d0e8ea7dd1531"
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expectedHash) {
            throw "Dioxus CLI archive checksum does not match."
          }
          $cargoBin = Join-Path $HOME ".cargo/bin"
          New-Item -ItemType Directory -Path $cargoBin -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $cargoBin -Force
          & "$cargoBin/dx.exe" --version

      - name: Build mainnet wallet
        run: ./scripts/build-windows.ps1

      - name: Prepare Windows installer and checksum
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $buildVersion = $env:RELEASE_TAG
          if ([string]::IsNullOrEmpty($buildVersion)) {
            $buildVersion = "dev-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          if ($buildVersion -cmatch '[^a-zA-Z0-9._-]') {
            throw "Release tag must contain only letters, numbers, dots, underscores, and hyphens."
          }
          $installers = @(Get-ChildItem "target/dx/Northbound/bundle/windows/msi" -Filter *.msi -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows MSI installer, found $($installers.Count)."
          }
          $installerName = "Northbound-$buildVersion-windows-x64.msi"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $installerPath = Join-Path dist $installerName
          Copy-Item -LiteralPath $installers[0].FullName -Destination $installerPath
          $hash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installerName" | Set-Content -LiteralPath "$installerPath.sha256" -Encoding ascii

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Northbound-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Attach files to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $files = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release upload "$env:RELEASE_TAG" @files --clobber
