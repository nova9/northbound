[package]
name = "wallet"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "Northbound"
path = "src/main.rs"

[features]
default = ["regtest"]
regtest = []
mainnet = []

[dependencies]
arboard = "3.7.0"
argon2 = "0.6.0"
base64 = "0.23.1"
bech32 = "0.12.0"
bip39 = { version = "3.0.0", features = ["rand"] }
bitcoin = "0.32.102"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4.3"
dioxus = { version = "0.7", features = ["desktop"] }
dirs = "6.0.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
shared = { version = "0.1.0", path = "../shared" }
zeroize = "1.9.1"
tokio = { version = "1.54.1", features = ["time"] }

[dev-dependencies]
hex = "0.4.3"
tempfile = "3.27.0"
