[package]
name = "server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shared = { version = "0.1.0", path = "../shared" }
tokio = { version = "1.54.1", features = ["fs", "macros", "rt-multi-thread"] }
