[package]
name = "indexer"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
hex = "0.4.3"
truenorth-rpc = { path = "../truenorth-rpc" }
shared = { path = "../shared" }
bech32 = "0.12.0"
base58 = { package = "base58ck", version = "0.1.101" }
rusqlite = { version = "=0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
tokio = { version = "1.54.1", features = ["time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
