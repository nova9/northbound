[package]
name = "truenorth-rpc"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
hex = "0.4.3"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
tokio = { version = "1.54.1", features = ["fs"] }
